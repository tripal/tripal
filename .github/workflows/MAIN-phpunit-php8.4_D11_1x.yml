name: 'PHPUnit'

on:
  workflow_dispatch:
  push:
    branches:
      - '4.x'
      - 'tv4g0-2208-codeclimateToQltyCloud'
  # Allows us to schedule when this workflow is run.
  # This ensures we pick up any new changes in Drupal.
  schedule:
    # Run at 6am every night.
    - cron: '0 6 * * *'

permissions: read-all

jobs:
  running-tests:
    name: 'Drupal 11.1: PHP 8.4'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v4'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.5'
        with:
          directory-name: 'tripal'
          modules: 'tripal tripal_biodb tripal_chado'
          php-version: '8.4'
          pgsql-version: '17'
          drupal-version: '11.1.x-dev'
          build-image: true
