name: 'PHPUnit Matrixed'

on:
  workflow_dispatch:
  pull_request:
    types: ['opened', 'synchronize']

permissions: read-all

jobs:
  run-tests:
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
        pgsql-version:
          - '13'
          - '17'
        drupal-version:
          - '10.4.x-dev'
          - '10.5.x-dev'
          - '11.1.x-dev'
          - '11.2.x-dev'
          - '11.x-dev'
        exclude:
          # Only Drupal 11.x supports PHP 8.4
          - php-version: '8.4'
            drupal-version: '10.4.x-dev'
          - php-version: '8.4'
            drupal-version: '10.5.x-dev'
          # Drupal 11+ requires at least php 8.3.
          - php-version: '8.1'
            drupal-version: '11.1.x-dev'
          - php-version: '8.2'
            drupal-version: '11.1.x-dev'
          - php-version: '8.1'
            drupal-version: '11.2.x-dev'
          - php-version: '8.2'
            drupal-version: '11.2.x-dev'
          # Drupal 11.x is the bleeding edge so only run it on the latest php.
          - php-version: '8.1'
            drupal-version: '11.x-dev'
          - php-version: '8.2'
            drupal-version: '11.x-dev'
          - php-version: '8.3'
            drupal-version: '11.x-dev'
          # Drupal 11+ requires at least Postgresql 16.
          - php-version: '8.3'
            pgsql-version: '13'
            drupal-version: '11.1.x-dev'
          - php-version: '8.4'
            pgsql-version: '13'
            drupal-version: '11.1.x-dev'
          - php-version: '8.3'
            pgsql-version: '13'
            drupal-version: '11.2.x-dev'
          - php-version: '8.4'
            pgsql-version: '13'
            drupal-version: '11.2.x-dev'
          # Drupal 11.x is the bleeding edge so only run it on the latest pgsql.
          - php-version: '8.4'
            pgsql-version: '13'
            drupal-version: '11.x-dev'
          # Exclude higher postgresql version from middle Drupal versions
          # This is done to reduce combinations; higher postgresql version
          # will be tested on merge to 4.x.
          # Note: Drupal 11.1 is already only tested on one postgresql
          # version since it requires 16+.
          - pgsql-version: '17'
            drupal-version: '10.5.x-dev'
    steps:
      # Check out the repo
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v4'
      # Here we fully build a docker using the current checked out code
      # to ensure we have not broken the install/build process.
      - name: 'Build Docker Image'
        run: |
          docker build --tag=tripaldocker:localdocker \
            --build-arg phpversion='${{ matrix.php-version }}' \
            --build-arg drupalversion='${{ matrix.drupal-version }}' \
            --build-arg postgresqlversion='${{ matrix.pgsql-version }}' \
            --build-arg chadoschema='teacup' ./
      # Just spin up docker the good ol' fashion way.
      - name: 'Spin up Local Docker'
        run: |
          docker run --publish=80:80 --name=tripaldocker -tid \
            --volume=`pwd`:/var/www/drupal/web/modules/contrib/tripal \
            tripaldocker:localdocker
          docker exec tripaldocker service postgresql restart
          docker exec tripaldocker bash -c 'export drupalversion="'${{ matrix.drupal-version }}'"; \
            if $(dpkg --compare-versions "${drupalversion}" "le" "10.9"); then \
            echo "Drupal version is ${drupalversion}, copying config for phpunit 9" \
            && mv web/modules/contrib/tripal/phpunit.xml web/modules/contrib/tripal/phpunit.11.xml \
            && mv web/modules/contrib/tripal/phpunit.9.6.xml web/modules/contrib/tripal/phpunit.xml; \
            elif $(dpkg --compare-versions "${drupalversion}" "le" "11.1.x-dev"); then \
            echo "Drupal version is ${drupalversion}, copying config for phpunit 10" \
            && mv web/modules/contrib/tripal/phpunit.xml web/modules/contrib/tripal/phpunit.11.xml \
            && mv web/modules/contrib/tripal/phpunit.10.xml web/modules/contrib/tripal/phpunit.xml; \
            else echo "Drupal version is ${drupalversion}, using config for phpunit 11"; fi'
      # Runs the PHPUnit tests.
      - name: 'Run PHPUnit Tests'
        run: |
          docker exec tripaldocker service postgresql restart
          docker exec --workdir=/var/www/drupal/web/modules/contrib/tripal \
            tripaldocker phpunit
