name: 'PHPUnit Matrixed'

on:
  workflow_dispatch:
  pull_request:
    types: ['opened', 'synchronize']

permissions: read-all

jobs:
  run-tests:
    runs-on: 'ubuntu-latest'

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        pgsql-version:
          - '14'
          - '18'
        drupal-version:
          - '10.6.x'
          - '11.3.x'
          - '11.4.x'
          - '11.x-dev'
        exclude:
          # Only Drupal 11.3+ supports PHP 8.5
          - php-version: '8.5'
            drupal-version: '10.6.x'
          # Drupal 11+ requires PHP 8.3+
          - php-version: '8.2'
            drupal-version: '11.3.x'
          - php-version: '8.2'
            drupal-version: '11.4.x'
          - php-version: '8.2'
            drupal-version: '11.x-dev'
          # Drupal 11.x is the bleeding edge so only run it on the latest php.
          - php-version: '8.2'
            drupal-version: '11.x-dev'
          - php-version: '8.3'
            drupal-version: '11.x-dev'
          - php-version: '8.4'
            drupal-version: '11.x-dev'
          # Drupal 11+ requires PostgreSQL 16+
          - pgsql-version: '14'
            drupal-version: '11.3.x'
          - pgsql-version: '14'
            drupal-version: '11.4.x'
          - pgsql-version: '14'
            drupal-version: '11.x-dev'
          # Drupal 11.x is the bleeding edge so only run it on the latest postgreSQL.
          - php-version: '8.4'
            pgsql-version: '14'
            drupal-version: '11.x-dev'
          - php-version: '8.5'
            pgsql-version: '14'
            drupal-version: '11.x-dev'
    steps:
      # Check out the repo
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v6'
      - name: 'Run Automated testing'
        uses: 'tripal/test-tripal-action@v1.8'
        with:
          directory-name: 'tripal'
          modules: ''
          build-image: TRUE
          dockerfile: 'Dockerfile'
          php-version: ${{ matrix.php-version }}
          pgsql-version: ${{ matrix.pgsql-version }}
          drupal-version: ${{ matrix.drupal-version }}
