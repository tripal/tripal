name: 'Remove obsolete images from DockerHub'

on:
  # To allow manual run.
  workflow_dispatch:
  schedule:
    # Run at 5am every morning, 1 hour after images are built.
    - cron: '0 5 * * *'
  # This next trigger is temporary for testing!
  pull_request:

permissions: 'read-all'

jobs:
  clean_dockerhub:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'

      - name: 'Docker Hub Cleanup'
        #uses: 'lostlink/docker-cleanup@v1.0.1'
        # Temporarily Use a locally forked copy to fix the bug described in
        # issues https://github.com/lostlink/docker-cleanup/issue/3 and 5
        # and additional changes to handle digests with multiple tags.
        # Long term, we are hoping dockerhub eventually provides a mechanism
        # for automatic image expiration.
        uses: ./.github/actions/lostlink/docker-cleanup
        with:
          # The first custom pattern matched has priority.
          custom-patterns: '{"latest": 30, "drupal": 30, "BUILT": 0}'
          repositories: 'tripaldocker-drupal,tripaldocker'
          username: '${{ secrets.DOCKERHUB_USERNAME }}'
          password: '${{ secrets.DOCKERHUB_PERSONAL_ACCESS_TOKEN_RWD }}'
          verbose: true
          dry-run: true
