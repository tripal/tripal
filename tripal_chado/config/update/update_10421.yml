- table: 'dbxref'
  conditions:
    - column: 'accession'
      value: 'exact'
  update_column: 'description'
  existing_value: ''
  update_value: 'The definition of the synonym is exactly the same as primary term definition. This is used when the same class can have more than one name.'
- table: 'dbxref'
  conditions:
    - column: 'accession'
      value: 'broad'
  update_column: 'description'
  existing_value: ''
  update_value: 'The primary definition accurately describes the synonym, but the definition of the synonym may encompass other structures as well. In some cases where a broad synonym is given, it will be a broad synonym for more than one ontology term.'
- table: 'dbxref'
  conditions:
    - column: 'accession'
      value: 'narrow'
  update_column: 'description'
  existing_value: ''
  update_value: 'The definition of the synonym is the same as the primary definition, but has additional qualifiers.'
- table: 'dbxref'
  conditions:
    - column: 'accession'
      value: 'related'
  update_column: 'description'
  existing_value: ''
  update_value: 'This scope is applied when a word or phrase has been used synonymously with the primary term name in the literature, but the usage is not strictly correct. That is, the synonym in fact has a slightly different meaning than the primary term name. Since users may not be aware that the synonym was being used incorrectly when searching for a term, related synonyms are included.'
