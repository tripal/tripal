                base_table: 'stock'
                type_table: 'stock'
                type_column: 'type_id'
        settings:
            termIdSpace: 'EFO'
            termAccession: '0007059'
            fixed_value: 'EFO:0007059'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 25
          form:
            default:
              region: 'content'
              weight: 25

