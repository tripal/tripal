                base_table: 'stock'
                base_column: 'description'
        settings:
            termIdSpace: 'schema'
            termAccession: 'description'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 20
          form:
            default:
              region: 'content'
              weight: 20

    -   name: 'germplasm_type'
        content_type: 'germplasm'
        label: 'Type'
