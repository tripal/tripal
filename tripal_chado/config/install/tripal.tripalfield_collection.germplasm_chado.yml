    -   name: 'germplasm_relationship'
        content_type: 'germplasm'
        label: 'Relationship'
        type: 'chado_relationship_type_default'
        description: "Germplasm related to this one. Think of relationship statements as sentences: SUBJECT TYPE OBJECT (e.g. 'Sara (subject) is the mother of (type) Jacob (object)'). By default the current germplasm is the subject; chose Reverse if the object is the current germplasm."
