      type: mapping
      label: 'Color mapping to apply to nodes in a phylogenetic tree'
      nullable: true
      mapping:
        index:
          type: 'integer'
          label: 'array key'
          mapping:
            organism:
              type: string
              label: 'Organism'
            color:
              type: string
              label: 'Color specification'

