      type: integer
      label: 'Diameter of the root node of a phylogenetic tree'
      nullable: true
    phylogram_root_node_color:
      type: string
      label: 'Color of the root node of a phylogenetic tree'
      nullable: true
    phylogram_interior_node_size:
      type: integer
      label: 'Diameter of the interior nodes of a phylogenetic tree'
      nullable: true
    phylogram_interior_node_color:
      type: string
      label: 'Color of the interior nodes of a phylogenetic tree'
      nullable: true
    phylogram_leaf_node_size:
      type: integer
      label: 'Diameter of the terminal nodes of a phylogenetic tree'
      nullable: true
    phylogram_leaf_node_color:
      type: string
      label: 'Color of the terminal nodes of a phylogenetic tree'
      nullable: true
