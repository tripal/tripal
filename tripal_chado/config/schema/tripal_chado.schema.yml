tripal_chado.settings:
  type: config_object
  mapping:
    default_schema:
      type: string
      label: 'Default Chado schema name'

## TripalStorage Field Storage Settings.
## @scope Applied to ALL Fields (due to limitation in Drupal).
## @note this is a reusable schema definition BUT it is not used by Drupal
##   automatically. Instead tripal will alter the schema later to add this.
## @see TripalEntityHooks::configSchemaInfoAlter()
tripal.chado.field_storage_settings:
  type: mapping
  mapping:
    storage_plugin_settings:
      type: mapping
      label: 'Tripal Storage-specific Settings'
      mapping:
        base_table:
          type: 'string'
          label: 'Field Base Chado Table'
          nullable: FALSE

##
## Re-usable Field Specific settings...
##
## Specific for base table focused fields.
tripal_chado.base_table_storage_settings:
  type: mapping
  mapping:
    storage_plugin_settings:
      type: mapping
      label: 'Tripal Storage-specific Settings'
      mapping:
        base_column:
          type: 'string'
          label: 'Field Base Chado Column'
          nullable: FALSE

## Specific for linking table focused fields.
tripal_chado.linking_table_storage_settings:
  type: mapping
  mapping:
    storage_plugin_settings:
      type: mapping
      label: 'Tripal Storage-specific Settings'
      mapping:
        base_column:
          type: 'string'
          label: 'Field Base Chado Column'
          nullable: FALSE
        object_table:
          type: string
          label: "The name of table joined to the base table through a linking table (e.g. synonym)."
        object_column:
          type: string
          label: "The column in the object table this field will be using (e.g. synonym_id)."
        linker_table:
          type: 'string'
          label: 'The linking table used to connect the base table to the object table (e.g. feature_synonym).'
          nullable: TRUE
        linker_fkey_column:
          type: 'string'
          label: 'The column in the linking table which is a foreign key pointing to the base table (e.g. for feature_synonym this would be feature_id).'
          nullable: TRUE
        linking_method:
          type: 'string'
          label: 'The path through which to link the base table to the fields linked table. For example to link "feature" to "synonym", the linking method would be "feature_synonym → synonym_id".'
          nullable: TRUE

