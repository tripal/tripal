      type: string
      label: 'Scaling transformation for the X-axis of a phylogenetic tree'
      nullable: true
    phylogram_layout:
      type: string
      label: 'Whether tree layout is linear or radial'
      nullable: true
    phylogram_font_size:
      type: string
      label: 'Font size to use when rendering a tree, defaults to 12'
      nullable: true
