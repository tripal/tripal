system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Analysis'
    termIdSpace: 'operation'
    termAccession: '2945'
    id: 'test_analysis'
    settings:
      chado_base_table: 'analysis'
  fields:
  - name: 'analysis_program'
    type: 'chado_string_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
    widget: 'chado_string_type_widget'
    formatter: 'chado_string_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'name'
    cardinality: 1
    required: true
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
        base_table: 'analysis'
        base_column: 'program'
      max_length: 255
  - name: 'analysis_programversion'
    type: 'chado_string_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
    widget: 'chado_string_type_widget'
    formatter: 'chado_string_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'softwareVersion'
    cardinality: 1
    required: true
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
        base_table: 'analysis'
        base_column: 'programversion'
      max_length: 255
  - name: 'analysis_timeexecuted'
    type: 'chado_datetime_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoDatetimeTypeDefault'
    widget: 'chado_datetime_type_widget'
    formatter: 'chado_datetime_type_formatter'
    termIdSpace: 'NCIT'
    termAccession: 'C25164'
    cardinality: 1
    required: false
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
        base_table: 'analysis'
        base_column: 'timeexecuted'
scenarios:
  - label: 'Create and load a datetime value'
    description: 'Creates an analysis with a specific timeexecuted timestamp and verifies the value
      survives a full save + load round-trip through Chado and Drupal storage.'
    create:
      user_input:
        analysis_program:
        - record_id: 0
          value: 'BLAST'
        analysis_programversion:
        - record_id: 0
          value: '2.14.0'
        analysis_timeexecuted:
        - record_id: 0
          value: '2025-01-15 10:30:00'
      expected:
        analysis_program:
        - record_id: 1
          value: 'BLAST'
        analysis_programversion:
        - record_id: 1
          value: '2.14.0'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-01-15 10:30:00'
    edit:
      user_input:
        analysis_program:
        - record_id: 1
          value: 'BLAST'
        analysis_programversion:
        - record_id: 1
          value: '2.14.0'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-06-20 14:45:00'
      expected:
        analysis_program:
        - record_id: 1
          value: 'BLAST'
        analysis_programversion:
        - record_id: 1
          value: '2.14.0'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-06-20 14:45:00'
  - label: 'Datetime with sub-second precision'
    description: 'Verifies that a timestamp carrying microseconds is stored and returned
      without truncation, since the varchar(32) column is wide enough to hold it.'
    create:
      user_input:
        analysis_program:
        - record_id: 0
          value: 'HMMER'
        analysis_programversion:
        - record_id: 0
          value: '3.4'
        analysis_timeexecuted:
        - record_id: 0
          value: '2025-03-10 08:00:00.123456'
      expected:
        analysis_program:
        - record_id: 1
          value: 'HMMER'
        analysis_programversion:
        - record_id: 1
          value: '3.4'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-03-10 08:00:00.123456'
    edit:
      user_input:
        analysis_program:
        - record_id: 1
          value: 'HMMER'
        analysis_programversion:
        - record_id: 1
          value: '3.4'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-03-10 09:15:30.000000'
      expected:
        analysis_program:
        - record_id: 1
          value: 'HMMER'
        analysis_programversion:
        - record_id: 1
          value: '3.4'
        analysis_timeexecuted:
        - record_id: 1
          value: '2025-03-10 09:15:30'
