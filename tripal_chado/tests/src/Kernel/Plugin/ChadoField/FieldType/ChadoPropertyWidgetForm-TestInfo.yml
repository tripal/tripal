            '#type': 'value'
          field_name:
            '#value': 'project_prop2'
          value:
            '#base_type': 'textarea'
            '#type': 'text_format'
          rank:
            '#type': 'value'
      expected_field_values:
        project_name:
        - record_id: 1
          value: 'Simple Project'
        project_description:
        - record_id: 1
          value: |
            This is a very simple project. We haven't even added any metadata to expand it's purpose.
