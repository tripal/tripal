system-under-test:
  chado_version: 1.3.3.013
  bundle:
    label: 'Project'
    termIdSpace: 'NCIT'
    termAccession: 'C47885'
    id: 'test_project'
    settings:
      chado_base_table: 'project'
  fields:
  - name: 'project_name'
    type: 'chado_string_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
    widget: 'chado_string_type_widget'
    formatter: 'chado_string_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'name'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'project'
          base_column: 'name'
      max_length: 255
  - name: 'project_description'
    type: 'chado_text_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoTextTypeDefault'
    widget: 'chado_text_type_widget'
    formatter: 'chado_text_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'description'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'project'
          base_column: 'description'
  - name: 'project_prop1'
    type: 'chado_property_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoPropertyTypeDefault'
    widget: 'chado_property_widget_default'
    formatter: 'chado_property_formatter_default'
    termIdSpace: 'rdfs'
    termAccession: 'comment'
    cardinality: -1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'project'
          prop_table: 'projectprop'
  - name: 'project_prop2'
    type: 'chado_property_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoPropertyTypeDefault'
    widget: 'chado_property_widget_default'
    formatter: 'chado_property_formatter_default'
    termIdSpace: 'NCIT'
    termAccession: 'C25341'
    cardinality: -1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'project'
          prop_table: 'projectprop'
scenarios:
  - label: 'Base Fields Only'
    description: 'Create a page without setting any properties.'
    create:
      user_input:
        project_name:
        - record_id: 0
          value: 'Simple Project'
        project_description:
        - record_id: 0
          value:
            format: basic_html
            value: |
              This is a very simple project. We haven't even added any metadata to expand it's purpose.
        project_prop1:
        - record_id: 0
          prop_id: 0
          linker_id: 0
          type_id: 181
          field_name: 'project_prop1'
          value:
            format: 'basic_html'
            value: ' '
          rank: 0
        project_prop2:
        - record_id: 0
          prop_id: 0
          linker_id: 0
          type_id: 181
          field_name: 'project_prop2'
          value:
            format: basic_html
            value: ' '
          rank: 0
      expected_form_keys:
        project_prop1:
        - record_id:
            '#type': 'value'
          prop_id:
            '#type': 'value'
          linker_id:
            '#type': 'value'
          type_id:
            '#type': 'value'
          field_name:
            '#value': 'project_prop1'
          value:
            '#base_type': 'textarea'
            '#type': 'text_format'
          rank:
            '#type': 'value'
        project_prop2:
