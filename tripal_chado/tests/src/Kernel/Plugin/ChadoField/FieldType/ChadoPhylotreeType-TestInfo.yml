system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Phylogenetic Tree'
    termIdSpace: 'data'
    termAccession: '0872'
    id: 'phylotree'
    settings:
      chado_base_table: 'phylotree'
  fields:
  - name: 'phylotree_name'
    type: 'chado_string_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
    widget: 'chado_string_type_widget'
    formatter: 'chado_string_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'name'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          base_column: 'name'
      max_length: 255
  - name: 'phylotree_comment'
    type: 'chado_text_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoTextTypeDefault'
    widget: 'chado_text_type_widget'
    formatter: 'chado_text_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'comment'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          base_column: 'comment'
  - name: 'phylotree_type'
    type: 'chado_additional_type_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoAdditionalTypeTypeDefault'
    widget: 'chado_additional_type_widget_default'
    formatter: 'chado_additional_type_formatter_default'
    termIdSpace: 'data'
    termAccession: '0872'
    # fixed_value: 'data:0872'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          type_table: 'phylotree'
          type_column: 'type_id'
  - name: 'phylotree_tree_type'
    type: 'chado_property_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoPropertyTypeDefault'
    widget: 'chado_property_widget_default'
    formatter: 'chado_property_formatter_default'
    termIdSpace: 'data'
    termAccession: '1122'
    cardinality: -1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          prop_table: 'phylotreeprop'
  - name: 'phylotree_dbxref'
    type: 'chado_dbxref_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoDbxrefTypeDefault'
    widget: 'chado_dbxref_widget_default'
    formatter: 'chado_dbxref_formatter_default'
    termIdSpace: 'SBO'
    termAccession: '0000554'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          base_column: 'dbxref_id'
  - name: 'phylotree_phylotreevis'
    type: 'chado_phylotreevis_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoPhylotreeVisTypeDefault'
    widget:
    formatter: 'chado_phylotreevis_type_formatter'
    termIdSpace: 'operation'
    termAccession: '0567'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'phylotree'
          base_column: 'phylotree_id'
