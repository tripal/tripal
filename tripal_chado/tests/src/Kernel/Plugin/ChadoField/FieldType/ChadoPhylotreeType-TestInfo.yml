          type_id: 26
          term_name: ''
          id_space: ''
          accession: ''
        phylotree_tree_type:
        - record_id: 0
          prop_id: 0
          linker_id: 0
          type_id: 28
          value: 'Maple'
          rank: 9
        phylotree_dbxref:
        - record_id: 0
          dbxref_id: 1
        phylotree_phylotreevis:
        - record_id: 0
