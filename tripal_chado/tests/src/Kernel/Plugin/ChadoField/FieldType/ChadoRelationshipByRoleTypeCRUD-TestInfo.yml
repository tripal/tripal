system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Project'
    termIdSpace: 'NCIT'
    termAccession: 'C47885'
    id: 'project'
    settings:
      chado_base_table: 'project'
  fields:
    - name: 'project_description'
      type: 'chado_text_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoTextTypeDefault'
      cardinality: 1
      widget: 'chado_text_type_widget'
      formatter: 'chado_text_type_formatter'
      termIdSpace: 'schema'
      termAccession: 'description'
      settings:
        termIdSpace: 'schema'
        termAccession: 'description'
        debug: false
        storage_plugin_settings:
          base_column: 'description'
          base_table: 'project'
        storage_plugin_id: 'chado_storage'
    - name: 'project_name'
      type: 'chado_string_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
      cardinality: 1
      widget: 'chado_string_type_widget'
      formatter: 'chado_string_type_formatter'
      termIdSpace: 'schema'
      termAccession: 'name'
      settings:
        termIdSpace: 'schema'
        termAccession: 'name'
        debug: false
        max_length: 255
        storage_plugin_settings:
          base_column: 'name'
          base_table: 'project'
        storage_plugin_id: 'chado_storage'
    - name: 'project_experiment'
      type: 'chado_relationship_by_role_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoRelationshipByRoleTypeDefault'
      cardinality: -1
      widget: 'chado_relationship_widget_default'
      formatter: 'chado_relationship_formatter_default'
      termIdSpace: 'SIO'
      termAccession: '001066'
      settings:
        termIdSpace: 'SIO'
        termAccession: '001066'
        debug: false
        storage_plugin_settings:
          base_table: 'project'
          base_column: 'name'
          linker_table: 'project_relationship'
          subject_column: 'subject_project_id'
          object_column: 'object_project_id'
        storage_plugin_id: 'chado_storage'
scenarios:
  - label: 'Default Values Only'
    description: 'Creates a page using only default values for each field.'
    create:
      user_input:
        project_description:
          - record_id: 0
            value: 'Abdo augue enim esse odio. Dolus magna populus quis singularis vindico.'
        project_name:
          - record_id: 0
            value: 'Caecus Hendrerit Turpis'
        project_experiment:
          - record_id: 0
            linker_id: 0
            subject_id: 0
            subject_entity_id: 0
            subject_name: ''
            object_id: 0
            object_entity_id: 0
            object_name: ''
            type_id: 248
            type_name: ''
            relationship_value: ''
            relationship_rank: 0
      expected:
        project_description:
          - record_id: 2
            value: 'Abdo augue enim esse odio. Dolus magna populus quis singularis vindico.'
        project_name:
          - record_id: 2
            value: 'Caecus Hendrerit Turpis'
        project_experiment:
          - record_id: 2
            linker_id: 1
            subject_id: 2
            subject_entity_id: -1
            subject_name: 'Caecus Hendrerit Turpis'
            object_id: 2
            object_entity_id: -1
            object_name: 'Caecus Hendrerit Turpis'
            type_id: 248
            type_name: 'guides'
    edit:
      user_input:
        project_description:
          - record_id: 2
            value: 'Abdo augue enim esse odio. Dolus magna populus quis singularis vindico.'
        project_name:
          - record_id: 2
            value: 'Caecus Hendrerit Turpis'
        project_experiment:
          # Self-reference: subject/object both point at this entity's own
          # project record (2), which was already published during create,
          # so the entity lookup can resolve a real entity id this time.
          - record_id: 2
            linker_id: 1
            subject_id: 2
            subject_entity_id: 0
            subject_name: ''
            object_id: 2
            object_entity_id: 0
            object_name: ''
            type_id: 248
            type_name: ''
            relationship_value: 'Caecus Hendrerit Turpis'
            relationship_rank: 0
      expected:
        project_description:
          - record_id: 2
            value: 'Abdo augue enim esse odio. Dolus magna populus quis singularis vindico.'
        project_name:
          - record_id: 2
            value: 'Caecus Hendrerit Turpis'
        project_experiment:
          - record_id: 2
            linker_id: 2
            subject_id: 2
            subject_entity_id: 1
            subject_name: 'Caecus Hendrerit Turpis'
            object_id: 2
            object_entity_id: 1
            object_name: 'Caecus Hendrerit Turpis'
            type_id: 248
            type_name: 'guides'
