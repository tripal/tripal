      termIdSpace: 'schema'
      termAccession: 'name'
      settings:
        termIdSpace: 'schema'
        termAccession: 'name'
        debug: false
        max_length: 255
        storage_plugin_settings:
          base_column: 'name'
          base_table: 'analysis'
        storage_plugin_id: 'chado_storage'
    - name: 'analysis_program'
      type: 'chado_string_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
