system-under-test:
  chado_version: '1.3.3.013'
scenarios:
  - label: 'TO subset vocabulary'
    description: 'Tests importing of the Plant Trait Ontology. To reduce time required, a small subset of the full ontology is used. This subset will make one external lookup request "Performing EBI OLS Lookup for: BFO:0000002"'
    tripal_cv_obo:
      name: 'TO'
      path: '{tripal_chado}/tests/fixtures/obo_loader/test_to.obo'
    expect_message: 'a lookup will be performed with the EBI Ontology Lookup Service'
    expect_db2cv_count: 3
    expect_cv_root_count: 1
    expect:
      - table: 'db'
        column: 'name'
        value: 'TO'
      - table: 'db'
        column: 'name'
        value: 'BFO'
      - table: 'cv'
        column: 'name'
        value: 'plant_trait_ontology'
      - table: 'cv'
        column: 'name'
        value: 'bfo'
      - table: 'cvterm'
        column: 'name'
        value: 'plant trait'
      - table: 'cvterm'
        column: 'name'
        value: 'continuant'
      - table: 'cvterm'
        column: 'name'
        value: 'mineral and ion content trait'
      - table: 'cvterm'
        column: 'name'
        value: 'shoot system strontium content'
      - table: 'dbxref'
        column: 'accession'
        value: 'has_absolute_phenotype'
      - table: 'dbxref'
        column: 'accession'
        value: '52'
      - table: 'dbxref'
        column: 'accession'
        value: '412'
      - table: 'dbxref'
        column: 'accession'
        value: 'has_absolute_phenotype'
  - label: 'EDAM subset vocabulary'
    description: 'Tests importing of the EDAM ontology. To reduce time required, a small subset of the full ontology is used.'
    tripal_cv_obo:
      name: 'EDAM'
      path: '{tripal_chado}/tests/fixtures/obo_loader/test_EDAM.obo'
    expect_db2cv_count: 3
    expect_cv_root_count: 0
    expect:
      - table: 'cvterm'
        column: 'name'
        value: 'Data'
      - table: 'cvterm'
        column: 'name'
        value: 'Format'
      - table: 'cvterm'
        column: 'name'
        value: 'Transcriptomics'
      - table: 'dbxref'
        column: 'accession'
        value: '0203'
      - table: 'dbxref'
        column: 'accession'
        value: '1915'
      - table: 'cvtermsynonym'
        column: 'synonym'
        value: 'Gene expression profiling'
