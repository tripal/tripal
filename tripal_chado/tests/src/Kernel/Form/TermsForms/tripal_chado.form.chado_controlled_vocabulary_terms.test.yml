'Controlled vocabulary term add form with a new term':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermForm'
    'setup':
      'views':
        - 'config/install/views.view.chado_controlled_vocabulary_terms'
    'args':
      - null
    'form_expectations':
      '#form_id': 'chado_cvterm_form'
      'cv_name':
        '#title': 'Controlled Vocabulary (Ontology) Name'
        '#description': 'Please select an existing controlled vocabulary'
        '#value': null
      'cvterm_id':
        '#value': null
      'cvterm_name':
        '#title': 'Controlled Vocabulary Term'
        '#description': 'Enter the name of the controlled vocabulary term'
      'cvterm_definition':
        '#title': 'Term Definition'
        '#description': 'Enter the definition of the controlled vocabulary term'
      'cvterm_is_relationshiptype':
        '#title': 'Is Relationshiptype'
      'cvterm_is_obsolete':
        '#title': 'Is Obsolete'
      'db_name':
        '#title': 'External Database Name'
        '#value': null
      'dbxref_accession':
        '#title': 'External Database Accession'
      'dbxref_version':
        '#title': 'External Database Accession Version'
      'dbxref_description':
        '#title': 'External Database Accession Description'
      'submit':
        '#value': 'Add'
      'cancel':
        '#markup': 'Cancel'
    'submit_values':
      'db_name': 'local (15)'
      'cv_name': 'local (2)'
      'dbxref_accession': '123456'
      'cvterm_name': 'ABCDEF'
    'submit_expectations':
      'db_name': 'local (15)'
    'submit_output':
      - 'Redirecting to'
    'submit_messages':
      - 'status: The vocabulary term "ABCDEF" has been added'
    'chado_expectations':
      - 'table': 'cvterm'
        'conditions':
          - 'column': 'name'
            'value': 'ABCDEF'
          - 'column': 'cv_id'
            'value': 2
        'count': 1
'Controlled vocabulary term add form with an existing term':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermForm'
    'setup':
      'views':
        - 'config/install/views.view.chado_controlled_vocabulary_terms'
    'args':
      - null
    'form_expectations':
      '#form_id': 'chado_cvterm_form'
    'submit_values':
      'db_name': 'local (15)'
      'cv_name': 'local (2)'
      'dbxref_accession': 'is_analysis'
      'cvterm_name': 'is_analysis'
    'submit_expectations':
      'cvterm_name': 'is_analysis'
    'submit_fails': true
    'submit_output':
      - ''
    'submit_messages':
      - 'error: The specified accession and version already exists for this database'
      - 'error: The specified vocabulary term and value of "Is Obsolete" already exists for this vocabulary'
'Controlled vocabulary term edit form with an existing term':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermForm'
    'setup':
      'views':
        - 'config/install/views.view.chado_controlled_vocabulary_terms'
    'args':
      'cvterm_id': 58
    'form_expectations':
      '#form_id': 'chado_cvterm_form'
      'db_name':
        '#value': 'local (15)'
      'cv_name':
        '#value': 'local (2)'
      'cvterm_id':
        '#value': 58
      'cvterm_name':
        '#value': 'is_analysis'
    'submit_values':
      'cvterm_name': 'was_analysis'
    'submit_expectations':
      'cvterm_name': 'was_analysis'
    'submit_output':
      - 'Redirecting to'
    'submit_messages':
      - 'status: The vocabulary term "was_analysis" has been updated'
    'chado_expectations':
      - 'table': 'cvterm'
        'conditions':
          - 'column': 'name'
            'value': 'is_analysis'
          - 'column': 'cv_id'
            'value': 2
        'count': 0
      - 'table': 'cvterm'
        'conditions':
          - 'column': 'name'
            'value': 'was_analysis'
          - 'column': 'cv_id'
            'value': 2
        'count': 1
'Controlled vocabulary term edit form with an invalid cvterm_id argument':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermForm'
    'args':
      'cvterm_id': 500000
    'submit_fails': true
    'submit_output':
      - 'Invalid cvterm_id "500000" passed to chado_cvterm_form'
'Controlled vocabulary term edit form with various invalid inputs':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermForm'
    'args':
      - null
    'form_expectations':
      '#form_id': 'chado_cvterm_form'
    'submit_values':
      'db_name':
        '#value': 'bogus (900000)'
      'cv_name':
        '#value': 'alsobogus (900001)'
    'submit_fails': true
    'submit_output':
      - ''
    'submit_messages':
      - 'error: Controlled Vocabulary (Ontology) Name field is required.'
      - 'error: Controlled Vocabulary Term field is required.'
      - 'error: External Database Name field is required.'
      - 'error: External Database Accession field is required.'
'Controlled vocabulary term delete form':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermDeleteForm'
    'setup':
      'views':
        - 'config/install/views.view.chado_controlled_vocabulary_terms'
    'args':
      'cvterm_id': 3
    'form_expectations':
      '#form_id': 'chado_cvterm_delete_form'
      'cvterm_id':
        '#value': 3
      'cvterm_name':
        '#value': 'accession'
      'description':
        '#type': 'table'
      'drop_dbxref':
        '#type': 'checkbox'
        '#title': 'Delete dbxref'
      'submit':
        '#value': 'Delete'
      'cancel':
        '#value': 'Cancel'
    'submit_values':
      'drop_dbxref': true
    'triggering_element':
      '#value': 'Delete'
    'submit_expectations':
      'cvterm_id': 3
    'submit_output':
      - 'Redirecting to'
    'submit_messages':
      - 'status: The term "accession" and dbxref have been deleted'
    'chado_expectations':
      - 'table': 'cvterm'
        'conditions':
          - 'column': 'cvterm_id'
            'value': 3
        'count': 0
      - 'table': 'dbxref'
        'conditions':
          - 'column': 'accession'
            'value': 'accession'
        'count': 0
'Controlled vocabulary term delete form with an invalid cvterm_id argument':
  - 'form_class': 'Drupal\tripal_chado\Form\ChadoCvtermDeleteForm'
    'setup':
      'views':
        - 'config/install/views.view.chado_controlled_vocabulary_terms'
    'args':
      'cvterm_id': 900000
    'submit_fails': true
    'submit_output':
      - 'Invalid cvterm_id "900000" passed to chado_cvterm_delete_form'
