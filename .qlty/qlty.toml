config_version = "0"

[[source]]
name = "default"
default = true

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/config/**",
  "**/vendor/**",
  "**/css/",
  "**/images/",
  "**/tests/",
  "**/docs/",
  "tripaldocker/",
]

test_patterns = [
  "**/tests/**",
  "**/*Test.php*",
]

[smells]
mode = "comment"

[smells.boolean_logic]
threshold = 5
enabled = true

[smells.nested_control_flow]
threshold = 7
enabled = true

[smells.function_parameters]
enabled = false

[smells.return_statements]
threshold = 8
enabled = true

[smells.file_complexity]
enabled = false

[smells.function_complexity]
threshold = 30
enabled = true

[smells.duplication]
threshold = 100
nodes_threshold = 300

[[plugin]]
name = "yamllint"
enabled = true
