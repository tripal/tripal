services:
  tripal_biodb.hooks:
    class: Drupal\tripal_biodb\Hook\TripalBiodbHooks
  tripal_biodb.logger:
    parent: 'logger.channel_base'
    arguments: ['tripal_biodb']
  tripal_biodb.lock:
    class: 'Drupal\tripal_biodb\Lock\PersistentDatabaseSharedLockBackend'
    arguments: ['@database', '@lock', '@state']
