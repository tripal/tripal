id: 'tripal_image'
label: 'Tripal Image Fields'
description: 'Default field configurations provided by the Tripal Image module'
dependencies:
    module:
        - 'tripal'
        - 'tripal_chado'
        - 'tripal_image'
    enforced:
        module:
            - 'tripal_image'

fields:
    -   name: 'eimage_id'
        content_type: 'tripal_image'
        label: 'eimage_id'
        type: 'chado_integer_type_default'
        description: 'The internal chado identifier number for this image.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                base_column: 'eimage_id'
        settings:
            termIdSpace: 'data'
            termAccession: '0842'
        display:
          view:
            default:
              region: 'content'
              label: 'inline'
              weight: 0
          form:
            default:
              region: 'hidden'
              weight: 99
    -   name: 'eimage_legend'
        content_type: 'tripal_image'
        label: 'Legend'
        type: 'chado_property_type_default'
        description: 'A description of the image.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                prop_table: 'eimageprop'
        settings:
            termIdSpace: 'SIO'
            termAccession: '000468'
        display:
          view:
            default:
              region: 'hidden'
              label: 'above'
              weight: 10
          form:
            default:
              region: 'content'
              weight: 10
              type: 'chado_property_string_widget_default'
    -   name: 'eimage_image'
        content_type: 'tripal_image'
        label: 'Rendered Image'
        type: 'chado_eimage_type_default'
        description: 'Displays the image on the screen.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                base_column: 'eimage_id'
        settings:
            termIdSpace: 'data'
            termAccession: '2968'
        display:
            view:
                default:
                    region: 'content'
                    label: 'hidden'
                    weight: 20
                    settings:
                        tripal_image_disable_link_to_entity: true
            form:
                default:
                    region: 'hidden'
                    weight: 20
    -   name: 'image_uri'
        content_type: 'tripal_image'
        label: 'Image URI'
        type: 'chado_string_type_default'
        description: 'A URI pointing to a locally or remotely hosted image file.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                base_column: 'image_uri'
            max_length: 255
        settings:
            termIdSpace: 'data'
            termAccession: '1047'
        display:
            view:
                default:
                    region: 'hidden'
                    label: 'above'
                    weight: 30
            form:
                default:
                    region: 'content'
                    weight: 30
                    settings:
                        filter_format: 'plain_text'
                        num_rows: 1
    -   name: 'eimage_encoding'
        content_type: 'tripal_image'
        label: 'Image Type'
        type: 'chado_string_type_default'
        description: 'Describes the type of data in "UUencoded Image Data", e.g. "png" or "jpg".'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                base_column: 'eimage_type'
            max_length: 255
        settings:
            termIdSpace: 'IAO'
            termAccession: '0000098'
        display:
            view:
                default:
                    region: 'hidden'
                    label: 'above'
                    weight: 31
            form:
                default:
                    region: 'content'
                    weight: 31
                    settings:
                        filter_format: 'plain_text'
                        num_rows: 1
    -   name: 'eimage_data'
        content_type: 'tripal_image'
        label: 'UUencoded Image Data'
        type: 'chado_text_type_default'
        description: 'We expect images in eimage_data (e.g. JPEGs) to be uuencoded.'
        cardinality: 1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                base_column: 'eimage_data'
        settings:
            termIdSpace: 'IAO'
            termAccession: '0000101'
        display:
            view:
                default:
                    region: 'hidden'
                    label: 'above'
                    weight: 32
            form:
                default:
                    region: 'content'
                    weight: 32
                    settings:
                        filter_format: 'plain_text'
                        num_rows: 5

# Optional Properties
    -   name: 'eimage_description'
        content_type: 'tripal_image'
        label: 'Description'
        type: 'chado_property_type_default'
        description: 'A description of this image.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                prop_table: 'eimageprop'
        settings:
            termIdSpace: 'schema'
            termAccession: 'description'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 41
          form:
            default:
              region: 'content'
              weight: 41
              type: 'chado_property_string_widget_default'
    -   name: 'eimage_date'
        content_type: 'tripal_image'
        label: 'Date'
        type: 'chado_property_type_default'
        description: 'The date that this image was acquired.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                prop_table: 'eimageprop'
        settings:
            termIdSpace: 'NCIT'
            termAccession: 'C25164'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 42
          form:
            default:
              region: 'content'
              weight: 42
              type: 'chado_property_string_widget_default'
    -   name: 'eimage_provider'
        content_type: 'tripal_image'
        label: 'Provider'
        type: 'chado_property_type_default'
        description: 'The person or group that provided this image.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                prop_table: 'eimageprop'
        settings:
            termIdSpace: 'NCIT'
            termAccession: 'C37900'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 43
          form:
            default:
              region: 'content'
              weight: 43
              type: 'chado_property_string_widget_default'

# Optional Linking Tables - These display only on the image content type.
    -   name: 'eimage_contact'
        content_type: 'tripal_image'
        label: 'Image Provider'
        type: 'chado_contact_type_default'
        description: 'An individual or organization that generated or provided this image.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                linker_table: 'eimage_contact'
                linker_fkey_column: 'contact_id'
        settings:
            termIdSpace: 'NCIT'
            termAccession: 'C47954'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 80
          form:
            default:
              region: 'content'
              weight: 80
    -   name: 'eimage_pub'
        content_type: 'tripal_image'
        label: 'Publication'
        type: 'chado_pub_type_default'
        description: 'A publication generating or referencing this image.'
        cardinality: -1
        required: false
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'eimage'
                linker_table: 'eimage_pub'
                linker_fkey_column: 'pub_id'
        settings:
            termIdSpace: 'TPUB'
            termAccession: '0000002'
        display:
          view:
            default:
              region: 'content'
              label: 'above'
              weight: 81
          form:
            default:
              region: 'content'
              weight: 81

