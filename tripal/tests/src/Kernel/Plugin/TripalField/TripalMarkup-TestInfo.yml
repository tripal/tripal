system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Project'
    termIdSpace: 'NCIT'
    termAccession: 'C47885'
    id: 'project'
    settings:
      chado_base_table: 'project'
  fields:
    - name: 'field_instructions'
      type: 'tripal_markup'
      type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalMarkupTypeItem'
      cardinality: 1
      widget: 'tripal_markup_widget'
      formatter: 'tripal_markup_formatter'
      termIdSpace: 'schema'
      termAccession: 'WebPageElement'
      settings:
        debug: false
        markup:
          value: '<p>This is my markup text.</p><p><em><strong>Beep</strong></em></p><p><em><strong>Beep</strong></em></p><p><em><strong>Boop</strong></em></p>'
          format: 'basic_html'
        storage_plugin_id: 'drupal_sql_storage'
        storage_plugin_settings: {  }
    - name: 'project_name'
      type: 'tripal_string_type'
      type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalStringTypeItem'
      cardinality: 1
      widget: 'default_tripal_string_type_widget'
      formatter: 'default_tripal_string_type_formatter'
      termIdSpace: 'schema'
      termAccession: 'name'
      settings:
        debug: false
        max_length: 255
        storage_plugin_id: 'drupal_sql_storage'
scenarios:
  - label: 'When markup is set'
    description: 'Creates a page using only default values for each field.'
    create:
      user_input:
        field_instructions:
          - has_value: true
        project_name:
          - value: 'Euismod Gilvus Letalis'
      expected:
        field_instructions:
          - has_value: true
        project_name:
          - value: 'Euismod Gilvus Letalis'
      expected_markup:
        value: '<p>This is my markup text.</p><p><em><strong>Beep</strong></em></p><p><em><strong>Beep</strong></em></p><p><em><strong>Boop</strong></em></p>'
        format: 'basic_html'
    edit:
      user_input:
        field_instructions:
          - has_value: true
        project_name:
          - value: 'Pertineo Quia Utrum'
      expected:
        field_instructions:
          - has_value: true
        project_name:
          - value: 'Pertineo Quia Utrum'
      expected_markup:
        value: '<p>This is my markup text.</p><p><em><strong>Beep</strong></em></p><p><em><strong>Beep</strong></em></p><p><em><strong>Boop</strong></em></p>'
        format: 'basic_html'
    widget:
    - key: 'has_value'
      '#type': 'value'
      '#value': 1
    - key: 'markup'
      '#type': 'processed_text'
      '#text': '<p>This is my markup text.</p><p><em><strong>Beep</strong></em></p><p><em><strong>Beep</strong></em></p><p><em><strong>Boop</strong></em></p>'
      '#format': 'basic_html'
    formatter:
      '#type': 'processed_text'
      '#text': '<p>This is my markup text.</p><p><em><strong>Beep</strong></em></p><p><em><strong>Beep</strong></em></p><p><em><strong>Boop</strong></em></p>'
      '#format': 'basic_html'
