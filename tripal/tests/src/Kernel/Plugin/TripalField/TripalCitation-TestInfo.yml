system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Project'
    termIdSpace: 'NCIT'
    termAccession: 'C47885'
    id: 'project'
    settings:
      chado_base_table: 'project'
  fields:
    - name: 'field_citation'
      type: 'tripal_citation_type'
      type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalCitationTypeItem'
      cardinality: 1
      widget: 'default_tripal_citation_type_widget'
      formatter: 'default_tripal_citation_type_formatter'
      termIdSpace: 'NCIT'
      termAccession: 'C41196'
      settings:
        debug: false
        storage_plugin_id: 'drupal_sql_storage'
        storage_plugin_settings: {  }
    - name: 'project_name'
      type: 'chado_string_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
      cardinality: 1
      widget: 'chado_string_type_widget'
      formatter: 'chado_string_type_formatter'
      termIdSpace: 'schema'
      termAccession: 'name'
      settings:
        debug: false
        max_length: 255
        storage_plugin_id: 'chado_storage'
        storage_plugin_settings:
          base_table: 'project'
          base_column: 'name'
    - name: 'field_year'
      type: 'tripal_string_type'
      type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalStringTypeItem'
      cardinality: 1
      widget: 'default_tripal_string_type_widget'
      formatter: 'default_tripal_string_type_formatter'
      termIdSpace: 'schema'
      termAccession: 'name'
      settings:
        debug: false
        max_length: 4
        storage_plugin_id: 'drupal_sql_storage'
    - name: 'project_contact'
      type: 'chado_contact_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoContactTypeDefault'
      widget: 'chado_contact_widget_default'
      formatter: 'chado_contact_formatter_default'
      termIdSpace: 'NCIT'
      termAccession: 'C47954'
      cardinality: -1
      required: false
      settings:
        storage_plugin_id: 'chado_storage'
        storage_plugin_settings:
            base_table: 'project'
            linker_table: 'project_contact'
            linker_fkey_column: 'contact_id'
    - name: 'project_pub'
      type: 'chado_pub_type_default'
      type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoPubTypeDefault'
      widget: 'chado_pub_widget_default'
      formatter: 'chado_pub_formatter_default'
      termIdSpace: 'TPUB'
      termAccession: '0000002'
      cardinality: -1
      required: false
      settings:
        storage_plugin_id: 'chado_storage'
        storage_plugin_settings:
            base_table: 'project'
            linker_table: 'project_pub'
            linker_fkey_column: 'pub_id'
scenarios:
  - label: 'When publication is not set'
    description: 'Creates a page using only default values for each field.'
    create:
      user_input:
        field_citation:
          - value: ''
        project_name:
          - value: 'Awesome project'
        field_year:
          - value: '2026'
        project_contact:
          - contact_id: 2
            contact_name: 'John Doe'
        project_pub:
          - pub_id: ''
      expected:
        field_citation:
          - value: ''
        project_name:
          - value: 'Awesome project'
        field_year:
          - value: '2026'
        project_contact:
          - contact_name: 'John Doe'
        project_pub:
          - pub_id: 0
    widget:
    - key: 'value'
      '#type': 'textarea'
    formatter:
      0:
        '#markup': 'John Doe. Awesome project. 2026.'
