system-under-test:
  bundle:
    label: 'Gemstones'
    termIdSpace: 'FAKE'
    termAccession: '123456'
    id: 'test_gemstone'
    title_format: 'TEST [TripalEntityType__label] <em>[common_name]</em> Entity #[TripalEntity__entity_id]'
    url_format: 'test/[TripalEntityType__entity_id]/[common_name]/[TripalEntity__entity_id]'
  fields:
  - name: 'common_name'
    type: 'tripal_string_type'
    type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalStringTypeItem'
    widget: 'default_tripal_string_type_widget'
    formatter: 'default_tripal_string_type_formatter'
    termIdSpace: 'FAKE'
    termAccession: 'name'
    cardinality: 1
    required: true
    settings:
      storage_plugin_id: 'drupal_sql_storage'
      max_length: 255
  - name: 'metaphysical_props'
    type: 'tripal_text_type'
    type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalTextTypeItem'
    widget: 'default_tripal_text_type_widget'
    formatter: 'default_tripal_text_type_formatter'
    termIdSpace: 'META'
    termAccession: 'properties'
    cardinality: 1
    required: false
    settings:
      storage_plugin_id: 'drupal_sql_storage'
  # Cannot test drupal field due to schema issues. See issue #1999.
  # - name: 'drupal_description'
  #   type: 'string_long'
  #   type_class: 'Drupal\Core\Field\Plugin\Field\FieldType\StringLongItem'
  #   widget: 'string_textarea'
  #   formatter: 'string'
  #   termIdSpace: 'META'
  #   termAccession: 'description'
  #   cardinality: 1
  #   required: false
  #   settings:
  #     storage_plugin_id: 'none'
scenarios:
  - label: 'Simple Entity'
    description: 'Create a page where every field has one value and the title/path are left empty.'
    create:
      user_input:
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
      expected_field_values:
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
    expectations:
      registerField:
        - field_name: 'field_that_doesnt_exist_at_all'
          expected_result: false
        - field_name: 'common_name'
          expected_result: true
      getStorageFields:
        all_fields:
        - 'common_name'
        - 'metaphysical_props'
        required_fields:
        - 'common_name'
        optional_fields:
        - 'metaphysical_props'
