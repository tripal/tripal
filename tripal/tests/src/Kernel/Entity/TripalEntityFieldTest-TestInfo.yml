system-under-test:
  bundle:
    label: 'Gemstones'
    termIdSpace: 'FAKE'
    termAccession: '123456'
    id: 'test_gemstone'
    title_format: 'TEST [TripalEntityType__label] <em>[common_name]</em> Entity #[TripalEntity__entity_id]'
    url_format: 'test/[TripalEntityType__entity_id]/[common_name]/[TripalEntity__entity_id]'
  fields:
  - name: 'common_name'
    type: 'tripal_string_type'
    type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalStringTypeItem'
    widget: 'default_tripal_string_type_widget'
    formatter: 'default_tripal_string_type_formatter'
    termIdSpace: 'FAKE'
    termAccession: 'name'
    cardinality: 1
    settings:
      storage_plugin_id: 'drupal_sql_storage'
      max_length: 255
  - name: 'metaphysical_props'
    type: 'tripal_text_type'
    type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalTextTypeItem'
    widget: 'default_tripal_text_type_widget'
    formatter: 'default_tripal_text_type_formatter'
    termIdSpace: 'META'
    termAccession: 'properties'
    cardinality: 1
    settings:
      storage_plugin_id: 'drupal_sql_storage'
  - name: 'missingstorage'
    type: 'tripal_text_type'
    type_class: 'Drupal\tripal\Plugin\Field\FieldType\TripalTextTypeItem'
    widget: 'default_tripal_text_type_widget'
    formatter: 'default_tripal_text_type_formatter'
    termIdSpace: 'META'
    termAccession: 'properties'
    cardinality: 1
    settings:
      storage_plugin_id: ''
scenarios:
  - label: 'Use format for title + URL'
    description: 'Create a page where every field has one value and the title/path are left empty.'
    create:
      title: 'TEST Gemstones <em>amazonite</em> Entity #1'
      url: '/test/test_gemstone/amazonite/1'
      user_input:
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
      expected:
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
    edit:
      title: 'TEST Gemstones <em>Amazonite</em> Entity #1'
      url: '/test/test_gemstone/amazonite/1'
      user_input:
        common_name:
        - value: 'Amazonite'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
      expected:
        common_name:
        - value: 'Amazonite'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
  - label: 'Use format for title + URL with HTML included'
    description: 'Create a page where every field has one value and the title/path are left empty.'
    create:
      title: 'TEST Gemstones <em>amazonite</em> Entity #1'
      url: '/test/test_gemstone/amazonite/1'
      user_input:
        common_name:
        - value: '<p>amazonite</p>'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
      expected:
        common_name:
        - value: '<p>amazonite</p>'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
    edit:
      title: 'TEST Gemstones <em><i>Amazo</i>nite</em> Entity #1'
      url: '/test/test_gemstone/amazonite/1'
      user_input:
        common_name:
        - value: '<p><i>Amazo</i>nite</p>'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
      expected:
        common_name:
        - value: '<p><i>Amazo</i>nite</p>'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
  - label: 'User submitted alias when creating'
    description: 'Create a page where every field has one value, the title sets a value (should be ignored) and the path is set (should be respected).'
    create:
      title: 'TEST Gemstones <em>amazonite</em> Entity #1'
      url: '/my/fixed/path'
      user_input:
        title:
        - value: 'IGNORE ME BOO'
        path:
        - alias: '/my/fixed/path'
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
      expected:
        common_name:
        - value: 'amazonite'
        metaphysical_props:
        - value: 'soothing, calming, healing from grief'
    edit:
      title: 'TEST Gemstones <em>Amazonite</em> Entity #1'
      url: '/my/fixed/path-2'
      user_input:
        title:
        - value: 'IGNORE ME BOO'
        path:
        - alias: '/my/fixed/path-2'
        common_name:
        - value: 'Amazonite'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
      expected:
        common_name:
        - value: 'Amazonite'
        metaphysical_props:
        - value: 'Amazonite is a stone of peace, truth, harmony, and communication. It gently soothes the nerves, and it’s energies can be felt to the touch. It brings emotional balance, mental clarity and physical health benefits while encouraging spiritual growth & energy work.'
