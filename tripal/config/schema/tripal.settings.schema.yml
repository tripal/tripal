tripal.settings:
  type: config_object
  label: Tripal Settings
  mapping:
    tripal_entity_type:
      type: config_object
      mapping:
        max_id:
          type: integer
        allowed_title_tags:
          type: string
    files:
      type: config_object
      mapping:
        max_size:
          type: integer
        quota:
          type: integer
        expiration:
          type: integer
    reserved_schema_patterns:
      type: sequence
      label: 'Reserved schema patterns'
      sequence:
        type: string
    test_schema_base_names:
      type: sequence
      label: 'Test schema base names'
      sequence:
        type: string