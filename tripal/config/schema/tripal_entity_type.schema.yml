tripal.content_type.*:
  type: config_entity
  label: 'Tripal Content Type'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    termIdSpace:
      type: string
      label: 'Term ID Space'
    termAccession:
      type: string
      label: 'Term Accession'
    help_text:
      type: text
      label: 'Help Text'
    category:
      type: string
      label: 'Category'
    title_format:
      type: string
      label: 'Title Format'
    url_format:
      type: string
      label: 'URL Format'
    hide_empty_field:
      type: boolean
      label: 'Hide Empty Fields'
    ajax_field:
      type: boolean
      label: 'AJAX Field Loading'
    third_party_settings:
      type: mapping
      mapping:
        tripal:
          type: mapping
          label: "Tripal Third-party settings"

views.access.tripal_content_views_access:
  type: mapping
  label: 'Tripal Content Views Access Handler'
  mapping:
    content_types:
      type: mapping
      label: 'Tripal Content Types'
      mapping:
        all:
          type: string
          label: 'Content Types'
    mode:
      type: string
      label: 'Multiple Permission Handling'
    operation:
      type: string
      label: 'Content Type Permission'
