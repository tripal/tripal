
##
# Core Tripal Permissions.
##
administer tripal:
  title: 'View Tripal Administration Pages'
  description: 'Allow the user to access administrative pages of Tripal. This includes the menus and listings (e.g. jobs, storage systems, extensions) but not management of the various subsystems as they have their own permissions.'
  restrict access: true

##
# Tripal Jobs.
##
manage tripal jobs:
  title: 'Manage Tripal Jobs'
  description: 'Allows the user to access the job management pages.'

##
# HTML 5 File Form Element
##
upload files:
  title: 'Upload Tripal Data Files'
  description: 'Allows the user to upload files using the Tripal HTML5 loader.'

make files permanent:
  title: 'Make Tripal Data Files Permanent'
  description: 'Allows the user to make files they have access to permanent. Files that are permanent will not expire and will not be cleaned up.'

admin tripal files:
  title: 'Administer Tripal Managed Files'
  description: 'Allows the user to administer file upload maximum size, user quotas and file expiration dates.'

manage tripal files:
  title: 'Manage Own Tripal Data Files'
  description: 'Allows users to manage their own data files uploaded via Tripal.'

manage tripal data collections:
  title: 'Manage Own Tripal Data Collections'
  description: 'Allows users to manage their own Tripal data collections.'

##
# Tripal Content (TripalEntity).
#
# Specifically,
# - Publish Tripal Content: 'publish tripal content'
# - Add Tripal Content Listing: ANY 1+ 'create TYPE content' permission(s)
# The following forms will have TYPE in the route and need the matching
# dynamic permission with that TYPE as follows:
# - Tripal Entity Add Form: 'create TYPE content'
# - Tripal Entity Edit Form: 'edit TYPE content'
# - Tripal Entity Unpublish Form: 'unpublish TYPE content'
# - Tripal Entity Delete Form: 'delete TYPE content'
#
# Any user with the 'administer tripal content' can access any of the above
# pages without needing any other permission.
#
# Dynamic permissions are handled by the following controller.
# @see Drupal\tripal\AccessTripalEntityAccessControlHandler
##
administer tripal content:
  title: 'Administer Tripal Content'
  description: 'Allows users to use all aspects of Tripal Content management including the administrative listing, publishing and per type create/edit/delete/unpublish.'
  restrict access: true

publish tripal content:
  title: 'Publish Tripal Content'
  description: 'Allows the user to generate Tripal content pages for existing records in backend storage (e.g. Chado) for any Tripal Content Type.'

##
# Tripal Content Type (TripalEntityType).
#
# - Tripal Content Type listing
# - Manage Fields for TripalEntityType
# - Manage Form for TripalEntityType
# - Manage Display for TripalEntityType
# - TripalEntityType Add Form
# - TripalEntityType Edit Form
# - TripalEntityType Delete Form
# - Import Content Type Collections
# - Add fields to a content type
# - Find Fields for a content type
##
manage tripal content types:
  title: 'Manage Tripal content types'
  description: 'Allows users to see the list of Tripal Content Types and manage their fields, forms and display.'
  restrict access: true

##
# Tripal Loader Permissions (TripalImporter).
#
# There are access permissions for each importer which are created dynamically.
# You need the dynamic permission + 'allow tripal import' to use any of the
# loaders. Additionally, if the loader has a Tripal HTML5 file upload then
# you need the permissions indicated above for that element.
#
# @see TripalImporterPermissionsController:permissions()
##
allow tripal import:
  title: 'Access Tripal Importer Admin Listing'
  description: 'Allow access to the listing of importers available through Tripal.'

##
# Callbacks for Dynamic permissions.
#
# The following class methods provide additional permissions that depend on
# site-specific content types + importers.
##
permission_callbacks:
  - 'Drupal\tripal\Controller\TripalImporterPermissionsController::permissions'
  - 'Drupal\tripal\Access\TripalEntityPermissions::tripalContentTypePermissions'
