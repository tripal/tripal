    termAccession: 'additionalType'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'file'
          type_table: 'file'
          type_column: 'type_id'
  - name: 'file_license'
    type: 'chado_license_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoLicenseTypeTypeDefault'
    widget: 'chado_license_widget_default'
