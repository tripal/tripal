    termIdSpace: 'schema'
    termAccession: 'license'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'file'
          linker_table: 'file_license'
          linker_fkey_column: 'license_id'
  - name: 'file_location'
    type: 'chado_file_location_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoFileLocationTypeTypeDefault'
    widget: 'chado_file_location_widget_default'
    formatter: 'chado_file_location_formatter_default'
    termIdSpace: 'schema'
    termAccession: 'itemLocation'
    cardinality: -1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'file'
          linker_table: 'fileloc'
          linker_fkey_column: 'file_id'
