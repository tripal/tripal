-
    table: file
    fields:
        file_id:
            size: big
            type: serial
            'not null': true
        name:
            type: text
            'not null': true
        type_id:
            type: int
            'not null': true
        description:
            type: text
    'primary key':
        - file_id
    'unique keys':
        file_c1:
            - name
    indexes:
        file_idx1:
            - name
        file_idx2:
            - type_id
    'foreign keys':
        cvterm:
            table: cvterm
            columns:
                type_id: cvterm_id
#        fileloc:
