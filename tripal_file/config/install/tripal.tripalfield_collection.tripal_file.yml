id: 'tripal_file'
label: 'Tripal File Fields'
description: 'Default field configurations provided by the Tripal File module'
dependencies:
    module:
        - tripal_file
    enforced:
        module:
            - tripal_file
fields:

    -   name: 'file_name'
        content_type: 'tripal_file'
        label: 'Name'
        type: 'chado_text_type_default'
        description: 'The name of the file.'
        cardinality: 1
        required: true
        storage_settings:
            storage_plugin_id: 'chado_storage'
            storage_plugin_settings:
                base_table: 'file'
                base_column: 'name'
        settings:
            termIdSpace: 'schema'
            termAccession: 'name'
        display:
            view:
                default:
                    region: 'content'
                    label: 'above'
                    weight: 10
                    settings:
                        field_prefix: ''
                        field_suffix: ''
            form:
                default:
                    region: 'content'
                    weight: 10
                    settings:
                        filter_format: 'plain_text'
                        num_rows: 1

