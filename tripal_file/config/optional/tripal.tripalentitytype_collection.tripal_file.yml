id: 'tripal_file'
label: 'Tripal File Content Types'
description: 'Files and associated licenses'
dependencies:
    module:
        - tripal_file
    enforced:
        module:
            - tripal_file
content_types:

    -   label: 'File'
        term: 'SIO:000396'
        help_text: 'A file is an information-bearing object that contains a physical embodiment of some information using a particular character encoding.'
        category: 'Tripal File'
        id: 'tripal_file'
        title_format: '[file_name]'
        url_format: 'file/[TripalEntity__entity_id]'
        settings:
            chado_base_table: file

    -   label: 'License'
        term: 'schema:license'
        help_text: 'A license document that applies to this content, typically indicated by URL.'
        category: 'Tripal File'
        id: 'tripal_license'
        title_format: '[license_name]'
        url_format: 'license/[TripalEntity__entity_id]'
        settings:
            chado_base_table: license
